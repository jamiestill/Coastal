<!-- Coastal Healthcare Advocates - "Advocate Beacon" mark
     Colourway: Reversed - Paper shield, cyan heart - on deep ink
     Intended ground: #0F1E4A

     Spiral stripes, rounded corners, lighthouse dropped clear of the peak:
       - the lighthouse is scaled 1.25x about (60,30) inside an unchanged shield, and
         clipped to it, so the tower base is held by the shield instead of overhanging it;
       - the tower stripes are no longer painted. Tower and stripes are ONE evenodd path,
         the stripes punched out, so the shield shows through them. The whole mark is a
         single stencil - lighthouse, beams and stripes are all negative space;
       - the collar runs 2 units past the tower top so the stripes meet it flush;
       - the sharp corners where the beams and the finial meet the shield outline are
         rounded (opening: erode 1.2, dilate 1.2, round joins) on the composed shape;
       - the tower stripes are HELICES on the tower surface, not flat diagonals, one
         revolution over the tower height;
       - NEW this round: each band's tapered tail is dropped so it ends blunt instead of
         as a needle against the tower edge, a small closing clears the hairline slivers
         where a stripe runs alongside the shield edge, and the whole lighthouse sits 3
         units lower so there is clear ground between the finial and the shield's peak.
         The mark ships as flat filled paths rather than a mask.
     There is no stripe colour in this file. Anything that previously specified one is out of date.

     COLOUR: these are the brand's own values, not Pantone. Nearest-Pantone equivalents
     are listed in README.txt as reference only, for quoting a job in Solid Coated.

     Artboard 120 x 132 units. Minimum size 20px wide - below ~28px use the favicon mark.
     Clear space: 12 units (10% of width) on all sides. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132"
