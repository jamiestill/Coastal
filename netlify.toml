# Coastal Healthcare Advocates — Netlify config.
# Static files at the repo root. `npm run build` compiles src/input.css into
# assets/css/site.css (git-ignored); Netlify installs from package-lock.json and
# caches node_modules between deploys.

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Security + caching headers. Mirrors the CSP <meta> in the HTML; the header wins where both apply.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; frame-ancestors 'none'; upgrade-insecure-requests"

# Cache rules are merged in file order; for a repeated header the last match wins,
# so the broad /assets/* baseline comes first and the specific rules refine it.

# HTML: always revalidate, so a deploy is visible on the next visit.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline for every static asset (covers the root-level PDFs, SVGs, etc.).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Fingerprint-free but rarely touched — a year, with a background refresh.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/logomarks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS + JS are referenced from HTML with a ?v=<content-hash> query string
# (npm run build -> scripts/version-assets.js), so the URL itself changes
# whenever a file's contents change -- safe to cache "forever".
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root-level favicon and manifest. (apple-touch-icons live under /assets/img/.)
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Social share card — not fingerprinted, so keep the window modest.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# --- Plausible analytics proxy (keeps CSP 'self'-only; loaded only after consent) ---
[[redirects]]
  from = "/js/script.js"
  to = "https://plausible.io/js/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/event"
  to = "https://plausible.io/api/event"
  status = 200
  force = true

# Netlify Forms fallback: with JS off, #intake-form (the only form on the site;
# see index.html) POSTs natively to action="/thanks". Netlify records the
# submission, then this rewrite serves index.html for /thanks (200, not a
# redirect). With JS on, contact-form.js submits via fetch to "/".
#
# Spam: honeypot (`company`) + a 2s time-trap in contact-form.js, plus a
# reCAPTCHA v2 widget (<div data-netlify-recaptcha> in the form). Netlify injects
# the widget + Google api.js at deploy time using the env vars SITE_RECAPTCHA_KEY
# (site key; scopes Builds+Runtime) and SITE_RECAPTCHA_SECRET (secret; Runtime),
# set in Site configuration -> Environment variables -- NOT committed here. Keys
# from google.com/recaptcha/admin (v2 checkbox). The script-src/frame-src grants
# for google.com/recaptcha + gstatic.com/recaptcha in the CSP above exist for it;
# keep them in sync with the <meta> CSP in index.html. Docs:
# docs.netlify.com/manage/forms/spam-filters/
[[redirects]]
  from = "/thanks"
  to = "/index.html"
  status = 200
